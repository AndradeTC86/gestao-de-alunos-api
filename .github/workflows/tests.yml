name: Testes de API

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest   

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar arquivo .env
        run: |
            touch .env
            echo "${{secrets.TEST_SECRETS}}" >> .env

      - name: Iniciar API
        run: npm start > server.log 2>&1 &

      - name: Aguardar API
        run: curl --retry 30 --retry-all-errors --retry-delay 1 --fail http://localhost:3000/

      - name: Executar testes
        run: npm test
